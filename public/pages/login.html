<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>i am coder - Student Login</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <a href="/" class="logo">&lt;/i am coder&gt;</a>
    <nav><a href="/register">Register</a></nav>
  </header>
  <div class="container" style="max-width: 450px;">
    <div class="card">
      <h2 style="margin-bottom: 1.5rem; color: #38bdf8;">Student Login</h2>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" required placeholder="student@coder.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn" style="width: 100%;">Sign In</button>
      </form>
      <p style="margin-top: 1rem; font-size: 0.9rem; color: #94a3b8;">Don't have an account? <a href="/register" style="color: #38bdf8;">Register here</a></p>
    </div>
  </div>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      localStorage.setItem('user', JSON.stringify({ name: 'Coder Student', role: 'student' }));
      window.location.href = '/dashboard';
    }
  </script>
</body>
</html>
