<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>i am coder - Student Registration</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <a href="/" class="logo">&lt;/i am coder&gt;</a>
    <nav><a href="/login">Login</a></nav>
  </header>
  <div class="container" style="max-width: 450px;">
    <div class="card">
      <h2 style="margin-bottom: 1.5rem; color: #38bdf8;">Create Student Account</h2>
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" required placeholder="student@coder.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn" style="width: 100%;">Register</button>
      </form>
      <p style="margin-top: 1rem; font-size: 0.9rem; color: #94a3b8;">Already registered? <a href="/login" style="color: #38bdf8;">Login here</a></p>
    </div>
  </div>
  <script>
    function handleRegister(e) {
      e.preventDefault();
      alert('Registration successful! Redirecting to login...');
      window.location.href = '/login';
    }
  </script>
</body>
</html>
